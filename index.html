<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Preparación de Equipo de Fútbol</title>
<style>
  :root{
    --rojo:#E31E24;
    --rojo-osc:#B3151A;
    --negro:#0E0F11;
    --negro2:#17181B;
    --gris:#8B8D93;
    --gris-claro:#D8D9DC;
    --blanco:#F5F5F6;
    --verde:#1FA85C;
    --azul:#1F8F55;
    --oro:#FFB100;
    --morado:#9B5DE0;
    --borde: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #1c1d21 0%, var(--negro) 55%);
    color:var(--blanco);
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .home{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:22px 24px 60px 24px;text-align:center;
    background:
      linear-gradient(180deg, rgba(227,30,36,0.14), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 40px);
  }
  .home .logo-mark{
    width:96px;height:auto;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:26px;
  }
  /* Brillo con box-shadow (no filter): Safari recorta los filtros en un recuadro */
  .home .logo-mark img{width:100%;height:auto;display:block;border-radius:22.5%;
    box-shadow:0 0 46px 6px rgba(227,30,36,0.5), 0 12px 40px rgba(0,0,0,0.45);}
  .home .kicker{
    color:var(--rojo);letter-spacing:2.5px;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:8px;
  }
  .home h1{
    font-size:29px;line-height:1.1;margin:0 0 6px 0;text-transform:uppercase;font-weight:900;letter-spacing:0.5px;
  }
  .home h1 span{color:var(--rojo);}
  .home p.subtitle{color:var(--gris);font-size:13px;margin:0 0 20px 0;max-width:380px;}

  .menu-grid{width:100%;display:flex;flex-direction:column;gap:10px;max-width:440px;}
  .menu-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--negro2);
    border:1px solid var(--borde);
    border-radius:16px;padding:15px 16px;
    cursor:pointer;text-align:left;text-decoration:none;color:inherit;
    transition:transform .12s ease, border-color .12s ease;
  }
  .menu-btn:active{transform:scale(0.98);border-color:rgba(227,30,36,0.5);}
  .menu-btn .icon{
    width:42px;height:42px;border-radius:12px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:rgba(227,30,36,0.14);color:var(--rojo);
  }
  .menu-btn.tactic .icon{background:rgba(31,168,92,0.15);color:var(--verde);}
  .menu-btn.plan .icon{background:rgba(31,143,85,0.15);color:var(--azul);}
  .menu-btn.plantilla .icon{background:rgba(255,177,0,0.15);color:var(--oro);}
  .menu-btn.plantilla-juvenil .icon{background:rgba(31,143,85,0.15);color:var(--azul);}
  .menu-btn.plantilla-cadete .icon{background:rgba(31,168,92,0.15);color:var(--verde);}
  .menu-btn.propuesta .icon{background:rgba(155,93,224,0.15);color:var(--morado);}
  .menu-btn .icon svg{width:22px;height:22px;}
  .menu-btn .txt{flex:1;}
  .menu-btn .txt .t1{font-weight:800;font-size:15px;letter-spacing:0.4px;text-transform:uppercase;}
  .menu-btn .txt .t2{font-size:12px;color:var(--gris);margin-top:3px;line-height:1.35;}
  .menu-btn .chev{color:var(--gris);font-size:20px;}

  .home-footer{margin-top:38px;font-size:11px;color:#55565c;letter-spacing:1px;}

  .credit-footer{
    position:fixed;left:0;right:0;bottom:0;
    text-align:center;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom, 0px)) 0;
    pointer-events:none;z-index:60;
  }
  .credit-footer span{
    display:inline-block;
    color:rgba(255,255,255,0.32);
    font-size:10.5px;letter-spacing:0.4px;
  }
</style>

#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 45%,#C8192F,#B3122B 45%,#7A0B1C 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s ease,transform .5s ease,visibility .5s}
#splash.off{opacity:0;transform:scale(1.12);visibility:hidden}
#um{width:min(45vw,210px);height:auto;overflow:visible;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
#um path{fill:#fff;transform-box:fill-box;transform-origin:center}
#um .u{animation:uIn 1.15s cubic-bezier(.16,.9,.3,1.08) both}
#um .m{animation:mIn 1.15s cubic-bezier(.16,.9,.3,1.08) both}
#um g{transform-origin:256px 260px;animation:pulso .45s ease-out 1.1s both}
#splash.esperar #um path,#splash.esperar #um g,#splash.esperar #onda,#splash.esperar{animation-play-state:paused}
#splash{animation:salida .5s ease 2.9s forwards}
@keyframes salida{to{opacity:0;transform:scale(1.12);visibility:hidden;pointer-events:none}}
@keyframes uIn{0%{transform:translate(-120vw,30px) rotate(-540deg) scale(.4);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
@keyframes mIn{0%{transform:translate(120vw,-30px) rotate(540deg) scale(.4);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
@keyframes pulso{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
#onda{position:absolute;left:50%;top:50%;width:min(45vw,210px);aspect-ratio:1;margin:calc(min(45vw,210px)/-2) 0 0 calc(min(45vw,210px)/-2);border-radius:50%;border:3px solid rgba(255,255,255,.8);opacity:0;animation:onda .8s ease-out 1.1s forwards;pointer-events:none}
@keyframes onda{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.9);opacity:0}}
</style>

<style>.sin-splash #splash{display:none}</style>

<script>
(function(){var sp=document.getElementById('splash');if(!sp)return;
if(document.documentElement.className.indexOf('sin-splash')>-1){sp.parentNode.removeChild(sp);return}
function quitar(){try{sessionStorage.setItem('umSplash','1')}catch(e){}if(sp.parentNode)sp.parentNode.removeChild(sp)}
function oculta(){return document.prerendering||document.visibilityState==='hidden'}
if(oculta()){sp.className='esperar';
  var ver=function(){if(oculta())return;sp.className='';document.removeEventListener('visibilitychange',ver);setTimeout(quitar,3600)};
  document.addEventListener('visibilitychange',ver);document.addEventListener('prerenderingchange',ver);
  setTimeout(function(){if(sp.className==='esperar'){sp.className='';setTimeout(quitar,3600)}},4000);
}else setTimeout(quitar,3600);
sp.addEventListener('click',quitar);
})();
</script>
